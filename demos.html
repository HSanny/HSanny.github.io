 "d2.real":"本番版では Florence-2 と SAM 2 を使い、現場画像 777 枚・11 条件（夜間、雨、反射、漂流物、濁水など）で検証しました。",
 "d.back":"← すべての実績へ戻る"

};
let LANG = "en";
try { const s = localStorage.getItem("lang"); if (D[s]) LANG = s; else { const n = (navigator.language || "").toLowerCase(); if (n.startsWith("zh")) LANG = "zh"; else if (n.startsWith("ja")) LANG = "ja"; } } catch (e) {}
const asked = new URL(location.href).searchParams.get("lang"); if (D[asked]) LANG = asked;
const t = (k, vars) => { let s = D[LANG][k] ?? window.I18N[LANG][k] ?? D.en[k] ?? window.I18N.en[k] ?? k; if (vars) for (const v in vars) s = s.replaceAll("{" + v + "}", vars[v]); return s; };
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

/* ---------- shared helpers ---------- */
function rng(seed){ return function(){ seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function gauss(r){ let u=0,v=0; while(!u)u=r(); while(!v)v=r(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); }
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function fitCanvas(c){ const r=c.getBoundingClientRect(); const d=Math.min(window.devicePixelRatio||1,2); const w=Math.max(10,Math.round(r.width*d)), h=Math.max(10,Math.round(r.height*d)); if(c.width!==w||c.height!==h){ c.width=w; c.height=h; } return {ctx:c.getContext("2d"),w,h,d}; }

/* ---------- demo 1: sensor fault detector ---------- */
const PER_DAY=96, DAYS=7, N=PER_DAY*DAYS, TRAIN=PER_DAY*3;
const FAULTS=["flat","spike","step","drop","drift"];
let faultOn={flat:true,spike:true,step:true,drop:true,drift:false}, seed=7, series=null, injected=[], events=[], lastMs=0;
function renderFaultToggles(){
  $("#d1faults").innerHTML=FAULTS.map(f=>`<button type="button" class="toggle" data-f="${f}" aria-pressed="${faultOn[f]}">${esc(t("f."+f))}</button>`).join("");
  document.querySelectorAll("#d1faults .toggle").forEach(b=>b.addEventListener("click",()=>{ faultOn[b.dataset.f]=!faultOn[b.dataset.f]; b.setAttribute("aria-pressed",String(faultOn[b.dataset.f])); build(); runDetector(); }));
}
function base(i){ const ph=(i%PER_DAY)/PER_DAY; return 2.4+0.55*Math.sin(2*Math.PI*(ph-0.3))+0.14*Math.sin(4*Math.PI*ph+0.6); }
function build(){
  const r=rng(seed); const x=new Array(N); for(let i=0;i<N;i++) x[i]=base(i)+0.025*gauss(r);
  injected=[];
  // fixed, non-overlapping slots after training window, jittered by seed
  const slots={flat:[TRAIN+40,24],spike:[TRAIN+150,1],step:[TRAIN+215,64],drop:[TRAIN+300,12],drift:[TRAIN+330,96]};
  for(const f of FAULTS){ if(!faultOn[f]) continue; let [s,len]=slots[f]; s+=Math.floor(r()*14);
    if(f==="flat"){ const v=x[s]; for(let i=s;i<s+len;i++) x[i]=v; }
    if(f==="spike"){ x[s]+= (r()<.5?-1:1)*(0.9+r()*0.4); }
    if(f==="step"){ const d=(r()<.5?-1:1)*(0.32+r()*0.15); for(let i=s;i<s+len;i++) x[i]+=d; }
    if(f==="drop"){ for(let i=s;i<s+len;i++) x[i]=NaN; }
    if(f==="drift"){ const d=(r()<.5?-1:1)*0.55; for(let i=s;i<s+len;i++) x[i]+=d*(i-s)/len; }
    injected.push({type:f,s,e:s+len-1});
  }
  series=x;
}
function median(a){ const b=a.slice().sort((p,q)=>p-q); const m=b.length>>1; return b.length%2?b[m]:(b[m-1]+b[m])/2; }
function runDetector(){
  if(!series) build();
  const t0=performance.now(); const x=series;
  // baseline per 15-min slot from training days (median / MAD)
  const exp=new Array(PER_DAY), sc=new Array(PER_DAY);
  for(let s=0;s<PER_DAY;s++){ const v=[]; for(let d=0;d<3;d++){ for(let k=-1;k<=1;k++){ const i=d*PER_DAY+((s+k+PER_DAY)%PER_DAY); v.push(x[i]); } } const m=median(v); exp[s]=m; sc[s]=1.4826*median(v.map(q=>Math.abs(q-m)))+0.01; }
  const E=i=>exp[i%PER_DAY], S=i=>sc[i%PER_DAY];
  const z=x.map((v,i)=>isNaN(v)?NaN:(v-E(i))/S(i));
  const ev=[]; const used=new Uint8Array(N);
  const add=(type,s,e,info)=>{ for(let i=s;i<=e;i++) used[i]=1; ev.push({type,s,e,...info}); };
  // dropout
  for(let i=TRAIN;i<N;i++){ if(isNaN(x[i])){ let j=i; while(j+1<N&&isNaN(x[j+1])) j++; if(j-i+1>=2) add("drop",i,j,{n:j-i+1}); i=j; } }
  // flatline: >=8 consecutive identical readings
  for(let i=TRAIN;i<N;i++){ if(used[i]||isNaN(x[i])) continue; let j=i; while(j+1<N&&!isNaN(x[j+1])&&Math.abs(x[j+1]-x[i])<1e-9) j++; if(j-i+1>=8){ add("flat",i,j,{n:j-i+1,v:x[i]}); i=j; } }
  // spike: isolated |z|>7
  for(let i=TRAIN+1;i<N-1;i++){ if(used[i]||isNaN(z[i])) continue; if(Math.abs(z[i])>7&&Math.abs(z[i-1]||0)<4&&Math.abs(z[i+1]||0)<4) add("spike",i,i,{d:x[i]-E(i)}); }
  // sustained deviation via EWMA on z (ignoring used points); classify step vs drift by onset sharpness
  let ew=0, run=0, start=-1; const lam=0.15;
  for(let i=TRAIN;i<N;i++){
    if(used[i]||isNaN(z[i])){ continue; }
    ew=lam*z[i]+(1-lam)*ew;
    if(Math.abs(ew)>3.2){ if(run===0) start=i; run++; } else { if(run>=10) closeDev(start,i-1); run=0; }
  }
  if(run>=10) closeDev(start,N-1);
  function closeDev(s,e){
    // walk back to onset where |z| first exceeded 2
    let on=s; while(on>TRAIN&&!used[on-1]&&Math.abs(z[on-1])>2) on--;
    const pre=[],post=[]; for(let k=on-8;k<on;k++) if(k>=0&&!isNaN(z[k])) pre.push(z[k]); for(let k=on;k<on+8&&k<=e;k++) if(!isNaN(z[k])) post.push(z[k]);
    const jump=Math.abs(median(post)-(pre.length?median(pre):0));
    const d=x[e]-E(e);
    add(jump>4.5?"step":"drift",on,e,{d});
  }
  ev.sort((a,b)=>a.s-b.s); events=ev; lastMs=performance.now()-t0;
  drawD1(exp,sc); logD1();
}
function fmtTime(i){ const d=Math.floor(i/PER_DAY)+1, m=(i%PER_DAY)*15; const hh=String(Math.floor(m/60)).padStart(2,"0"), mm=String(m%60).padStart(2,"0"); return (LANG==="en"?"Day "+d:LANG==="zh"?"第 "+d+" 天":d+" 日目")+" "+hh+":"+mm; }
function logD1(){
  const caught=injected.filter(f=>events.some(e=>e.e>=f.s-2&&e.s<=f.e+2)).length;
  const falses=events.filter(e=>!injected.some(f=>e.e>=f.s-2&&e.s<=f.e+2)).length;
  $("#d1score").innerHTML=injected.length?`<span>${esc(t("d1.caught"))} <b>${caught}/${injected.length}</b></span><span>${esc(t("d1.false"))} <b>${falses}</b></span><span>${esc(t("d1.time"))} <b>${lastMs.toFixed(1)} ms</b></span>`:`<span>${esc(t("d1.none"))}</span>`;
  const sgn=v=>(v>0?"+":"−")+Math.abs(v).toFixed(2)+" m";
  $("#d1log").innerHTML=events.map(e=>{ const body=e.type==="flat"?t("a.flat",{v:e.v.toFixed(3),n:e.n}):e.type==="drop"?t("a.drop",{n:e.n}):e.type==="spike"?t("a.spike",{d:sgn(e.d)}):e.type==="step"?t("a.step",{d:sgn(e.d)}):t("a.drift",{d:sgn(e.d)});
    return `<div class="msg"><div class="h">🔔 ${esc(t("d1.alert"))} · ${esc(t("f."+e.type))}</div><div>${esc(body)}</div><div class="s">${esc(fmtTime(e.s))} → ${esc(fmtTime(e.e))}</div></div>`; }).join("")||`<div class="note">—</div>`;
}
function drawD1(exp,sc){
  const c=$("#d1c"); const {ctx,w,h,d}=fitCanvas(c); const L=44*d,R=10*d,T=12*d,B=26*d;
  ctx.clearRect(0,0,w,h);
  const vals=series.filter(v=>!isNaN(v)); const lo=Math.min(...vals)-0.1, hi=Math.max(...vals)+0.1;
  const X=i=>L+(w-L-R)*i/(N-1), Y=v=>T+(h-T-B)*(1-(v-lo)/(hi-lo));
  ctx.font=`${11*d}px IBM Plex Mono, monospace`; ctx.fillStyle=css("--muted"); ctx.strokeStyle=css("--grid"); ctx.lineWidth=1*d;
  for(let k=0;k<=4;k++){ const v=lo+(hi-lo)*k/4; const y=Y(v); ctx.beginPath(); ctx.moveTo(L,y); ctx.lineTo(w-R,y); ctx.stroke(); ctx.fillText(v.toFixed(1),4*d,y+4*d); }
  for(let dd=0;dd<=DAYS;dd++){ const x=X(Math.min(N-1,dd*PER_DAY)); ctx.beginPath(); ctx.moveTo(x,T); ctx.lineTo(x,h-B); ctx.stroke(); if(dd<DAYS) ctx.fillText((LANG==="en"?"D":"")+(dd+1)+(LANG==="zh"?"天":LANG==="ja"?"日":""),x+4*d,h-8*d); }
  // training shade
  ctx.fillStyle=css("--water-soft"); ctx.fillRect(L,T,X(TRAIN)-L,h-T-B);
  // expected band
  ctx.fillStyle=css("--grid"); ctx.beginPath(); for(let i=0;i<N;i++){ const s=i%PER_DAY; ctx.lineTo(X(i),Y(exp[s]+3*sc[s])); } for(let i=N-1;i>=0;i--){ const s=i%PER_DAY; ctx.lineTo(X(i),Y(exp[s]-3*sc[s])); } ctx.closePath(); ctx.globalAlpha=.9; ctx.fill(); ctx.globalAlpha=1;
  // events
  for(const e of events){ ctx.fillStyle=css("--signal-soft"); ctx.fillRect(X(e.s)-3*d,T,Math.max(6*d,X(e.e)-X(e.s)+6*d),h-T-B); }
  // line
  ctx.strokeStyle=css("--water"); ctx.lineWidth=1.4*d; ctx.beginPath(); let pen=false; for(let i=0;i<N;i++){ const v=series[i]; if(isNaN(v)){ pen=false; continue; } const x=X(i),y=Y(v); if(!pen){ctx.moveTo(x,y);pen=true;} else ctx.lineTo(x,y); } ctx.stroke();
  // event markers
  ctx.fillStyle=css("--signal"); ctx.strokeStyle=css("--signal"); ctx.lineWidth=2*d;
  for(const e of events){ ctx.beginPath(); ctx.moveTo(X(e.s),T); ctx.lineTo(X(e.e)+0.01,T); ctx.stroke(); ctx.fillText(t("f."+e.type),Math.min(X(e.s),w-R-70*d),T+12*d); }
}
$("#d1new").addEventListener("click",()=>{ seed=Math.floor(Math.random()*1e9); build(); runDetector(); });

/* ---------- demo 2: flood gauge reader ---------- */
let cond={rain:false,glare:false,murky:false,dusk:false}, gSeed=3;
function renderCond(){
  $("#d2cond").innerHTML=Object.keys(cond).map(k=>`<button type="button" class="toggle" data-c="${k}" aria-pressed="${cond[k]}">${esc(t("c."+k))}</button>`).join("");
  document.querySelectorAll("#d2cond .toggle").forEach(b=>b.addEventListener("click",()=>{ cond[b.dataset.c]=!cond[b.dataset.c]; b.setAttribute("aria-pressed",String(cond[b.dataset.c])); readGauge(); }));
}
const GW=220, GH=440, TOP=30, BOT=410, GX0=86, GX1=134;   // gauge geometry in scene pixels
function cmToY(cm){ return BOT-(BOT-TOP)*cm/800; }
function renderScene(level){
  const off=document.createElement("canvas"); off.width=GW; off.height=GH; const g=off.getContext("2d"); const r=rng(gSeed+Math.round(level));
  // wall
  const wall=g.createLinearGradient(0,0,GW,0); wall.addColorStop(0,"#8d8f88"); wall.addColorStop(1,"#a3a59d"); g.fillStyle=wall; g.fillRect(0,0,GW,GH);
  for(let i=0;i<400;i++){ g.fillStyle=`rgba(60,60,55,${r()*0.15})`; g.fillRect(r()*GW,r()*GH,2,2); }
  // gauge plate
  g.fillStyle="#f4f3ee"; g.fillRect(GX0,TOP-12,GX1-GX0,BOT-TOP+24);
  for(let cm=0;cm<=800;cm+=10){ const y=cmToY(cm); const big=cm%100===0, mid=cm%50===0; g.fillStyle="#1a1a1a"; g.fillRect(GX0,y-1,big?30:mid?22:12,2); }
  for(let m=0;m<8;m++){ const y0=cmToY(m*100+100), y1=cmToY(m*100+80); g.fillStyle="#e2b417"; g.fillRect(GX1-14,y0,14,y1-y0); }
  g.fillStyle="#1a1a1a"; g.font="bold 11px IBM Plex Mono, monospace"; for(let m=1;m<=8;m++){ g.fillText(String(m*100),GX0+31,cmToY(m*100)+4); }
  // water
  const wy=cmToY(level);
  const wc=cond.murky?[128,112,82]:[52,92,98];
  for(let y=Math.floor(wy-3);y<GH;y++){ const wave=Math.sin(y*0.7)*1.5; for(let x=0;x<GW;x+=2){ const surf=wy+Math.sin(x*0.09+level)*2.2; if(y<surf) continue; const n=(r()-.5)*18; g.fillStyle=`rgb(${wc[0]+n+wave},${wc[1]+n},${wc[2]+n})`; g.fillRect(x,y,2,1); } }
  // reflection of gauge just below surface
  g.fillStyle="rgba(240,240,230,0.18)"; g.fillRect(GX0,wy+2,GX1-GX0,12);
  if(cond.glare){ const gr=g.createRadialGradient(GX0+30,wy+16,2,GX0+30,wy+16,46); gr.addColorStop(0,"rgba(255,255,250,0.75)"); gr.addColorStop(1,"rgba(255,255,250,0)"); g.fillStyle=gr; g.fillRect(0,wy-30,GW,90); }
  if(cond.rain){ g.strokeStyle="rgba(230,235,240,0.45)"; g.lineWidth=1; for(let i=0;i<140;i++){ const x=r()*GW, y=r()*GH; g.beginPath(); g.moveTo(x,y); g.lineTo(x-3,y+14); g.stroke(); } }
  if(cond.dusk){ g.fillStyle="rgba(20,25,45,0.45)"; g.fillRect(0,0,GW,GH); }
  return off;
}
function readGauge(){
  const level=+$("#d2lvl").value; const scene=renderScene(level);
  const t0=performance.now();
  const g=scene.getContext("2d"); const img=g.getImageData(GX0+4,0,GX1-GX0-20,GH).data; const W=GX1-GX0-20;
  // reference: gauge plate brightness measured on the top calibration band (always dry)
  const rowStats=y=>{ let sb=0,sr=0,sg=0,sbl=0,cnt=0; for(let x=0;x<W;x++){ const k=(y*W+x)*4; const R=img[k],G=img[k+1],Bc=img[k+2]; const br=(R+G+Bc)/3; if(br<70) continue; sb+=br; sr+=R; sg+=G; sbl+=Bc; cnt++; } return cnt?{br:sb/cnt,R:sr/cnt,G:sg/cnt,B:sbl/cnt,cnt}:{br:0,R:0,G:0,B:0,cnt:0}; };
  let ref=0,rn=0; for(let y=TOP-8;y<TOP+30;y++){ const s=rowStats(y); if(s.cnt){ ref+=s.br; rn++; } } ref/=rn||1;
  // a row is "plate" when it is bright relative to the reference and low in saturation
  const isPlate=y=>{ const s=rowStats(y); if(!s.cnt) return false; const mx=Math.max(s.R,s.G,s.B), mn=Math.min(s.R,s.G,s.B); const sat=(mx-mn)/(mx||1); return s.br>ref*0.78 && sat<0.22 && s.cnt>W*0.35; };
  // scan downward; the water line is the first row after which 10 of the next 12 rows are not plate
  let plateY=BOT;
  for(let y=TOP;y<BOT;y++){ if(isPlate(y)) continue; let not=0; for(let k=0;k<12;k++) if(!isPlate(y+k)) not++; if(not>=10){ plateY=y; break; } }
  // second cue: the water surface also crosses the concrete wall beside the gauge; water is far more saturated than wet concrete
  const WX0=GX1+34, WW=GW-WX0-4; const wimg=g.getImageData(WX0,0,WW,GH).data;
  const wallSat=y=>{ let s=0; for(let x=0;x<WW;x++){ const k=(y*WW+x)*4; const R=wimg[k],G=wimg[k+1],Bc=wimg[k+2]; const mx=Math.max(R,G,Bc),mn=Math.min(R,G,Bc); s+=(mx-mn)/(mx||1); } return s/WW; };
  let dry=0; for(let y=4;y<TOP+20;y++) dry+=wallSat(y); dry/=(TOP+16);   // saturation of dry wall in this lighting
  let wallY=-1; for(let y=TOP;y<BOT+20&&y<GH-8;y++){ let wet=0; for(let k=0;k<8;k++) if(wallSat(y+k)>dry+0.08) wet++; if(wet>=7){ wallY=y; break; } }
  // trust the wall cue when the plate is washed out by glare (plate line far below the wall line)
  const found=(wallY>0&&Math.abs(plateY-wallY)>10)?wallY:plateY;
  const est=Math.max(0,Math.min(800,(BOT-found)/(BOT-TOP)*800));
  const ms=performance.now()-t0;
  // draw scene + detection
  const c=$("#d2c"); const {ctx,w,h}=fitCanvas(c); ctx.imageSmoothingEnabled=true; ctx.drawImage(scene,0,0,w,h);
  const sy=found*h/GH; ctx.strokeStyle=css("--signal")||"#c4700f"; ctx.lineWidth=Math.max(2,w/110); ctx.setLineDash([6,4]); ctx.beginPath(); ctx.moveTo(0,sy); ctx.lineTo(w,sy); ctx.stroke(); ctx.setLineDash([]);
  $("#d2est").textContent=Math.round(est)+" cm";
  $("#d2err").textContent=t("d2.err",{e:(est-level>=0?"+":"−")+Math.abs(est-level).toFixed(0), t:ms.toFixed(1)});
}
$("#d2lvl").addEventListener("input",readGauge);

function applyLang() {
  document.documentElement.lang = LANG === "zh" ? "zh-Hans" : LANG;
  document.querySelectorAll("[data-t]").forEach((el) => (el.textContent = t(el.dataset.t)));
  document.querySelectorAll(".langs button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.lang === LANG)));
  renderFaultToggles(); renderCond(); runDetector(); readGauge();
}
document.querySelectorAll(".langs button").forEach((b) => b.addEventListener("click", () => { LANG = b.dataset.lang; try { localStorage.setItem("lang", LANG); } catch (e) {} applyLang(); }));
// Canvas colours come from CSS variables, so redraw when the theme or size changes.
document.addEventListener("themechange", () => { runDetector(); readGauge(); });
let rz; window.addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => { runDetector(); readGauge(); }, 120); });
build(); applyLang();
</script>

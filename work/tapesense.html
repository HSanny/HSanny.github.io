      flow: { en: ['each release', 'evidence engine', 'link keeps its hit rate', 'weak links flagged'], zh: ['每次数据公布', '证据引擎', '每条链记录命中率', '标出变弱的链'], ja: ['各発表', 'エビデンスエンジン', 'リンクごとに的中率を記録', '弱いリンクを表示'] },
      guards: { en: ['scores come only from measured moves', 'users see how often a link held'], zh: ['分数只来自实测行情', '用户看得到每条链成立的频率'], ja: ['スコアは実測の値動きのみ', 'リンクの的中頻度を表示'] } },
    { i: 'route', h: { en: 'Release-night agent', zh: '数据公布夜智能体', ja: '指標発表ナイトエージェント' },
      flow: { en: ['calendar trigger', 'fetch actual vs forecast', 'evidence engine', 'draft event card + posts', 'human approves', 'publish'], zh: ['日历触发', '抓实际值 vs 预期', '证据引擎', '起草事件卡片 + 帖子', '人工审核', '发布'], ja: ['カレンダーで起動', '実績と予想を取得', 'エビデンスエンジン', 'イベントカードと投稿を作成', '人が承認', '公開'] },
      guards: { en: ['every number traced to a tool call', 'nothing ships without approval', 'platform rules checked'], zh: ['每个数字都来自工具调用', '没有审核不发布', '检查各平台规则'], ja: ['数字はすべてツール呼び出し由来', '承認なしでは公開しない', '各プラットフォームの規則を確認'] } },
    { i: 'agent', h: { en: 'Ask TapeSense tutor', zh: '「问盘感」AI 导师', ja: '「TapeSense に質問」チューター' },
      flow: { en: ['user question', 'read-only tools: quotes · releases · chains · evidence · glossary', 'answer names the chain and its evidence'], zh: ['用户提问', '只读工具：行情 · 公布日历 · 逻辑链 · 证据 · 术语', '回答说明是哪条链、证据在哪'], ja: ['ユーザーの質問', '読み取り専用ツール：相場・発表・チェーン・証拠・用語', 'どのチェーンか、根拠は何かを回答'] },
      guards: { en: ['no buy or sell calls', 'per-request cost cap', 'golden-question tests'], zh: ['不给买卖建议', '每次提问有成本上限', '用标准问题集测试'], ja: ['売買の推奨はしない', 'リクエストごとのコスト上限', 'ゴールデン質問でテスト'] } },
    { i: 'trace', h: { en: 'Graph-maintenance agent', zh: '图谱维护智能体', ja: 'グラフ保守エージェント' },
      flow: { en: ['weak link flagged', 'gather evidence', 'draft a change to the link', 'human approves', 'graph updated'], zh: ['标出变弱的链', '收集证据', '起草修改', '人工审核', '更新图谱'], ja: ['弱いリンクを検出', '証拠を収集', 'リンクの修正案を作成', '人が承認', 'グラフを更新'] },
      guards: { en: ['proposes, never edits directly', 'every change cites its evidence'], zh: ['只提议，不直接改', '每个改动附证据'], ja: ['提案のみで直接編集しない', '変更には必ず根拠を付ける'] } },
  ];
  const PROBLEMS = [
    { i: 'phone', p: { en: 'Remote testing without paying for app-store accounts', zh: '不付应用商店年费，也要让人远程测试', ja: 'ストア費用なしでリモートテストしたい' },
      f: { en: 'Web build on a fixed hosted link; deploys are verified on the new build before the cached link updates', zh: '部署网页版到固定链接；先在新部署地址验证，再等固定链接的缓存更新', ja: '固定リンクで Web 版を公開。キャッシュ更新前に新しいデプロイで検証' } },
    { i: 'globe', p: { en: 'Automatic Traditional conversion produced wrong Taiwan finance words', zh: '自动繁体转换产生了不对的台湾金融用词', ja: '自動繁体字変換で台湾の金融用語が誤った' },
      f: { en: 'A regional term layer runs after conversion, with regression tests for every fix', zh: '在转换后加一层地区用语修正，每个修正都有回归测试', ja: '変換後に地域用語レイヤーを追加し、修正ごとに回帰テスト' } },
    { i: 'eye', p: { en: 'The radar mislabelled a rally that shorts were piling into', zh: '雷达把"空头不断加仓的上涨"标错了类型', ja: 'ショートが積み上がる上昇をレーダーが誤分類' },
      f: { en: 'Reordered the rules so who is paying funding decides first; locked in with tests on the real cases', zh: '调整规则顺序，先看哪一方在付资金费率；用真实案例写成测试锁住', ja: '資金調達率を払う側を先に判定するよう規則を並べ替え、実例でテスト' } },
    { i: 'scale', p: { en: 'Signal reader and radar disagreed on the same coin', zh: '信号解读和雷达对同一个币给出不同结论', ja: '同じ銘柄でシグナルリーダーとレーダーが矛盾' },
      f: { en: 'Extreme funding now carries more weight, and the reader shows the reason on screen', zh: '极端资金费率加重权重，并在画面上说明原因', ja: '極端な資金調達率の重みを上げ、理由を画面に表示' } },
    { i: 'chart', p: { en: 'The 24-hour reaction came back empty for releases at :30', zh: '整点半公布的数据，24 小时反应量不出来', ja: '30 分発表の指標で 24 時間後の反応が空になった' },
      f: { en: 'Fetch the hourly candles from earlier so the "before" price always exists', zh: '提早抓取小时 K 线，确保一定有"公布前"的价格', ja: '1 時間足を早めから取得し、「発表前」の価格を必ず確保' } },
    { i: 'trace', p: { en: 'Analytics without adding a native SDK', zh: '不加原生 SDK 也要有数据分析', ja: 'ネイティブ SDK なしで分析したい' },
      f: { en: 'Plain HTTP events that work on web and phone, anonymous with an opt-out, plus an in-app survey', zh: '用普通 HTTP 发事件，网页和手机都能用；匿名、可关闭，并加入 App 内问卷', ja: 'Web とスマホで動く HTTP イベント。匿名でオプトアウト可、アプリ内アンケート付き' } },
  ];

  let lang = 'en';
  try { const s = localStorage.getItem('lang'); if (['en', 'zh', 'ja'].includes(s)) lang = s; else if ((navigator.language || '').startsWith('zh')) lang = 'zh'; else if ((navigator.language || '').startsWith('ja')) lang = 'ja'; } catch (e) {}
  const asked = new URL(location.href).searchParams.get('lang');
  if (['en', 'zh', 'ja'].includes(asked)) lang = asked;
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
  const t = (k) => (C[lang][k] ?? window.I18N[lang][k] ?? C.en[k] ?? window.I18N.en[k] ?? k);
  function render() {
    document.documentElement.lang = lang === 'zh' ? 'zh-Hans' : lang;
    document.querySelectorAll('[data-t]').forEach((el) => (el.textContent = t(el.dataset.t)));
    document.querySelectorAll('.langs button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
    document.getElementById('smartList').innerHTML = SMART.map((s) =>
      `<div class="dtile">${window.icon(s.i)}<div><h3>${esc(s.h[lang])}</h3><p class="plus">${esc(s.does[lang])}</p><p class="why">${esc(s.why[lang])}</p></div></div>`).join('');
    document.getElementById('agentList').innerHTML = AGENTS.map((a) =>
      `<div class="dtile">${window.icon(a.i)}<div><span class="status">${esc(t('lbl.status'))}</span><h3>${esc(a.h[lang])}</h3><div class="flowsteps">${a.flow[lang].map((s, i) => `${i ? '<i>→</i>' : ''}<span${/approv|审核|承認/.test(s) ? ' class="human"' : ''}>${esc(s)}</span>`).join('')}</div><div class="guards">${a.guards[lang].map((g) => `<span>${esc(g)}</span>`).join('')}</div></div></div>`).join('');
    document.getElementById('problemList').innerHTML = PROBLEMS.map((p) =>
      `<div class="dtile">${window.icon(p.i)}<div><p class="minus" style="color:var(--ink)"><b>${esc(p.p[lang])}</b></p><p class="plus">${esc(p.f[lang])}</p></div></div>`).join('');
  }
  document.querySelectorAll('.langs button').forEach((b) => b.addEventListener('click', () => { lang = b.dataset.lang; try { localStorage.setItem('lang', lang); } catch (e) {} render(); }));
  window.paintArt();
  render();
})();
</script>

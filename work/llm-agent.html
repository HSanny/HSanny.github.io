    }).join('');
    const o = orders.map(([x, y]) => `<rect x="${x - 6}" y="${y - 5}" width="12" height="10" rx="2" fill="var(--panel)" stroke="var(--muted)"/>`).join('');
    const s = sites.map(([x, y]) => `<circle cx="${x}" cy="${y}" r="${good ? 4 : 9}" fill="${colour}" opacity="${good ? 0.85 : 1}"/>`).join('');
    return `<svg viewBox="0 0 260 150" aria-hidden="true">${links}${o}${s}<text x="12" y="146" font-size="9.5" fill="var(--faint)">work orders</text><text x="${good ? 150 : 200}" y="146" font-size="9.5" fill="var(--faint)">sites</text></svg>`;
  }

  let lang = 'en';
  try { const s = localStorage.getItem('lang'); if (['en', 'zh', 'ja'].includes(s)) lang = s; else if ((navigator.language || '').startsWith('zh')) lang = 'zh'; else if ((navigator.language || '').startsWith('ja')) lang = 'ja'; } catch (e) {}
  const asked = new URL(location.href).searchParams.get('lang');
  if (['en', 'zh', 'ja'].includes(asked)) lang = asked;
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
  const t = (k) => (C[lang][k] ?? window.I18N[lang][k] ?? C.en[k] ?? window.I18N.en[k] ?? k);
  function render() {
    document.documentElement.lang = lang === 'zh' ? 'zh-Hans' : lang;
    document.querySelectorAll('[data-t]').forEach((el) => (el.textContent = t(el.dataset.t)));
    document.querySelectorAll('.langs button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
    document.getElementById('decisionList').innerHTML = DECISIONS.map((d, n) =>
      `<div class="dtile">${window.icon(d.i)}<div><span class="meta">${String(n + 1).padStart(2, '0')}</span><h3>${esc(d.h[lang])}</h3><p class="plus">${esc(d.gain[lang])}</p><p class="minus">${esc(d.cost[lang])}</p></div></div>`).join('');
    document.getElementById('againList').innerHTML = AGAIN.map((a) => `<div class="tile">${window.icon(a.i)}<b>${esc(a.h[lang])}</b></div>`).join('');
  }
  document.querySelectorAll('.langs button').forEach((b) => b.addEventListener('click', () => { lang = b.dataset.lang; try { localStorage.setItem('lang', lang); } catch (e) {} render(); }));
  document.getElementById('vizBad').innerHTML = misjoin(false);
  document.getElementById('vizGood').innerHTML = misjoin(true);
  window.paintArt();
  render();
})();
</script>
</body>
</html>
